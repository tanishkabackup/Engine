name: TaskInsightEngine-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Clone repository code onto the GitHub Actions runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the .NET Core API Container
      - name: Build API
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: backend/TaskInsightEngine/TaskInsightEngine.Api/Dockerfile
          push: false 
          tags: taskinsightengine-api:latest 

      # 4. Build the Next.js Frontend Container
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with: 
          context: ./frontend/taskinsightengine-ui
          file: ./frontend/taskinsightengine-ui/Dockerfile
          push: false
          tags: taskengine-frontend:latest